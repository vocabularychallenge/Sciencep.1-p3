<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1759c7"><title>Science Explorer | เรียนวิทย์สองภาษา</title><style>
:root{font-family:system-ui,'Noto Sans Thai',sans-serif;color:#17345b;background:#eef5ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#174ec4,#17a7bd);color:white;padding:22px 18px 28px;border-radius:0 0 28px 28px}header h1{margin:0;font-size:clamp(28px,5vw,42px)}header p{font-size:19px;margin:8px 0}.wrap{max-width:950px;margin:auto;padding:14px}.toolbar,.tabs,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar{margin-top:14px}.tabs{margin:15px 0}button,select,input{font:inherit;font-size:19px;border-radius:15px;border:2px solid #d1e0f8;padding:12px;background:white;color:#17418c}button{cursor:pointer;font-weight:700;touch-action:manipulation}button:focus-visible{outline:4px solid orange}button.primary,.tabs button.active{background:#1759c7;color:white;border-color:#1759c7}button:disabled{opacity:.5}.card{background:white;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 5px 18px #1c52951a}.card h2{font-size:26px;margin:0 0 10px}.big{font-size:clamp(25px,5vw,38px);font-weight:800}.thai{font-size:23px;color:#315c83}.muted{color:#536e91}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.choice{width:100%;text-align:left;min-height:65px}.correct{background:#d5f8e7;border-color:#1f9e65}.wrong{background:#ffe0df;border-color:#e56a64}.pill{background:#e8f1ff;padding:7px 13px;border-radius:50px;font-weight:700}.progress{height:16px;border-radius:20px;background:#dce9fa;overflow:hidden}.progress>div{height:100%;background:#20aa8b;transition:width .2s}#feedback{font-size:22px;min-height:32px}footer{text-align:center;color:#657b97;padding:25px}.hidden{display:none!important} .symbol{font-size:65px} @media(min-width:650px){header{padding-left:max(24px,calc((100vw - 950px)/2))}}@media(max-width:450px){button{font-size:17px;padding:11px}.card{padding:16px}}
 .tabs a{font-size:18px;font-weight:750;text-decoration:none;color:#1759c7;background:white;border:2px solid #d1e0f8;border-radius:14px;padding:12px;flex:1;text-align:center;min-width:140px} section{scroll-margin-top:18px} html{scroll-behavior:smooth} main>h2{font-size:26px;margin:25px 4px 0} </style></head><body><header><h1>🔬 Science Explorer</h1><p>เรียนวิทยาศาสตร์สองภาษา ป.1–ป.3 • ฟัง • เล่น • ฝึกคิด</p><div class="toolbar"><label for="grade">ชั้นเรียน</label><select id="grade"><option value="1">ป.1</option><option value="2">ป.2</option><option value="3">ป.3</option></select><span class="pill" id="score">⭐ 0 คะแนน</span></div></header><main class="wrap"><nav class="tabs" aria-label="ข้ามไปยังหัวข้อ"><a href="#learn">📖 เรียนรู้</a><a href="#quiz">🧠 แบบทดสอบ</a><a href="#game">🎮 เกมจับคู่</a><a href="#progress">🏆 ความก้าวหน้า</a></nav><h2>📖 เรียนรู้คำศัพท์</h2><section id="learn"></section><h2>🧠 แบบทดสอบ</h2><section id="quiz"></section><h2>🎮 เกมจับคู่</h2><section id="game"></section><h2>🏆 ความก้าวหน้า</h2><section id="progress"></section></main><footer>Science Explorer • บันทึกผลในอุปกรณ์นี้ • เสียงขึ้นอยู่กับเสียงที่ติดตั้งในเครื่อง</footer><script>
const DATA={1:[['Sun','ดวงอาทิตย์','☀️','The Sun gives Earth light and heat.','ดวงอาทิตย์ให้แสงและความร้อนแก่โลก'],['Plant','พืช','🌱','Plants need water and light to grow.','พืชต้องการน้ำและแสงเพื่อเจริญเติบโต'],['Water','น้ำ','💧','Water can be a liquid, solid, or gas.','น้ำมีสถานะเป็นของเหลว ของแข็ง หรือแก๊สได้'],['Shadow','เงา','🌑','A shadow forms when an object blocks light.','เงาเกิดเมื่อวัตถุบังแสง'],['Magnet','แม่เหล็ก','🧲','A magnet attracts some metals such as iron.','แม่เหล็กดึงดูดโลหะบางชนิด เช่น เหล็ก'],['Roots','ราก','🌿','Roots absorb water from soil.','รากดูดซึมน้ำจากดิน']],2:[['Habitat','ถิ่นที่อยู่','🌳','A habitat is where an organism lives.','ถิ่นที่อยู่คือสถานที่ที่สิ่งมีชีวิตอาศัยอยู่'],['Evaporation','การระเหย','🌤️','Liquid water can change into water vapor.','น้ำของเหลวเปลี่ยนเป็นไอน้ำได้'],['Friction','แรงเสียดทาน','🛝','Friction can slow moving objects.','แรงเสียดทานทำให้วัตถุที่เคลื่อนที่ช้าลงได้'],['Life cycle','วงจรชีวิต','🦋','A butterfly changes during its life cycle.','ผีเสื้อเปลี่ยนแปลงรูปร่างในวงจรชีวิต'],['Transparent','โปร่งใส','🪟','Transparent materials let most light pass through.','วัสดุโปร่งใสยอมให้แสงส่วนใหญ่ผ่าน'],['Sound','เสียง','🔔','Sound is produced by vibrations.','เสียงเกิดจากการสั่นสะเทือน']],3:[['Gravity','แรงโน้มถ่วง','🌍','Gravity pulls objects toward Earth.','แรงโน้มถ่วงดึงวัตถุเข้าหาโลก'],['Conductor','ตัวนำ','⚡','A conductor allows electric current to flow.','ตัวนำยอมให้กระแสไฟฟ้าไหลผ่าน'],['Insulator','ฉนวน','🧤','An electrical insulator resists electric current.','ฉนวนไฟฟ้าต้านการไหลของกระแสไฟฟ้า'],['Food chain','ห่วงโซ่อาหาร','🐛','A food chain shows how energy passes between organisms.','ห่วงโซ่อาหารแสดงการถ่ายทอดพลังงานระหว่างสิ่งมีชีวิต'],['Condensation','การควบแน่น','☁️','Water vapor can cool and become liquid droplets.','ไอน้ำเย็นลงและกลายเป็นหยดน้ำได้'],['Force','แรง','💪','A force is a push or a pull.','แรงคือการผลักหรือดึง']]};
const $=id=>document.getElementById(id);let grade=localStorage.getItem('se_grade')||'1',tab='learn',index=0,qIndex=0,answered=false,gameItems=[],gamePick=null;let stats=JSON.parse(localStorage.getItem('se_stats')||'{}');function current(){return DATA[grade]}function record(){localStorage.setItem('se_stats',JSON.stringify(stats));$('score').textContent='⭐ '+(stats[grade]?.points||0)+' คะแนน'}function state(){return stats[grade]||(stats[grade]={points:0,learned:[],quiz:0,correct:0,matches:0})}function add(n){state().points+=n;record();renderProgress()}function speak(t,lang){if(!('speechSynthesis'in window)){alert('เบราว์เซอร์นี้ไม่รองรับเสียงพูด');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.82;u.volume=1;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2)));if(v)u.voice=v;speechSynthesis.speak(u)}function renderLearn(){let d=current()[index];$('learn').innerHTML=`<div class="card"><div class="row"><span class="pill">คำที่ ${index+1} / ${current().length}</span><span class="pill">ป.${grade}</span></div><div class="symbol">${d[2]}</div><div class="big">${d[0]}</div><div class="thai">${d[1]}</div><div class="row" style="margin-top:15px"><button id="en">🔊 ฟังอังกฤษ</button><button id="th">🔊 ฟังไทย</button></div><hr style="border:0;border-top:1px solid #dce7f4;margin:20px 0"><p style="font-size:22px">${d[3]}</p><p class="thai">${d[4]}</p><div class="row"><button id="sentEn">▶ อ่านประโยค EN</button><button id="sentTh">▶ อ่านประโยค TH</button></div><div class="row" style="margin-top:20px"><button id="prev">⬅ ก่อนหน้า</button><button class="primary" id="done">✓ เรียนแล้ว</button><button id="next">ถัดไป ➡</button></div></div>`;$('en').onclick=()=>speak(d[0],'en-US');$('th').onclick=()=>speak(d[1],'th-TH');$('sentEn').onclick=()=>speak(d[3],'en-US');$('sentTh').onclick=()=>speak(d[4],'th-TH');$('prev').onclick=()=>{index=(index+current().length-1)%current().length;renderLearn()};$('next').onclick=()=>{index=(index+1)%current().length;renderLearn()};$('done').onclick=()=>{if(!state().learned.includes(index)){state().learned.push(index);add(5)}index=(index+1)%current().length;renderLearn()}}
function renderQuiz(){let d=current()[qIndex%current().length];let options=[d[1],...current().filter(x=>x!==d).slice(0,3).map(x=>x[1])];let shift=(qIndex*3+Number(grade))%4;options=options.slice(shift).concat(options.slice(0,shift));answered=false;$('quiz').innerHTML=`<div class="card"><div class="row"><span class="pill">ข้อ ${qIndex+1} / ${current().length}</span><button id="hearQ">🔊 ฟังคำศัพท์</button></div><h2>คำว่า <span class="big">${d[0]}</span> หมายถึงอะไร?</h2><div id="answers" class="grid"></div><p id="feedback" aria-live="polite"></p><button id="nextQ" class="primary hidden">ข้อต่อไป ➡</button></div>`;$('hearQ').onclick=()=>speak(d[0],'en-US');let area=$('answers');options.forEach(v=>{let b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{if(answered)return;answered=true;state().quiz++;let ok=v===d[1];if(ok){state().correct++;add(10)}else {record();renderProgress()}[...area.children].forEach(c=>{c.disabled=true;if(c.textContent===d[1])c.classList.add('correct');else if(c===b)c.classList.add('wrong')});$('feedback').textContent=ok?'🎉 ถูกต้อง! +10 คะแนน':'คำตอบที่ถูกคือ '+d[1];$('nextQ').classList.remove('hidden')};area.appendChild(b)});$('nextQ').onclick=()=>{qIndex++;if(qIndex>=current().length){$('quiz').innerHTML=`<div class="card"><h2>🎉 จบแบบทดสอบแล้ว!</h2><p class="thai">ตอบถูกสะสม ${state().correct} จาก ${state().quiz} ครั้ง</p><button class="primary" id="again">เริ่มใหม่</button></div>`;$('again').onclick=()=>{qIndex=0;renderQuiz()}}else renderQuiz()}}
function shuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}function renderGame(){let pairs=current().slice(0,4);gameItems=shuffle(pairs.flatMap((d,i)=>[{id:i,side:'en',text:d[0]},{id:i,side:'th',text:d[1]}]));gamePick=null;drawGame()}function drawGame(){let done=gameItems.filter(x=>x.done).length/2;$('game').innerHTML=`<div class="card"><h2>🎮 จับคู่คำศัพท์</h2><p class="thai">จับคู่ภาษาอังกฤษกับคำแปลไทย</p><div class="progress"><div style="width:${done/4*100}%"></div></div><p id="gameMsg" aria-live="polite">จับคู่ให้ครบ 4 คู่!</p><div id="tiles" class="grid"></div><button id="restart" style="margin-top:18px">🔄 เล่นใหม่</button></div>`;$('restart').onclick=renderGame;let area=$('tiles');gameItems.forEach((item,i)=>{let b=document.createElement('button');b.className='choice'+(item.done?' correct':'');b.textContent=item.done?'✓ '+item.text:item.text;b.disabled=!!item.done;b.onclick=()=>{if(gamePick===null){gamePick=i;b.style.borderColor='#ffad25';return}let a=gameItems[gamePick];if(i===gamePick)return;if(a.id===item.id&&a.side!==item.side){a.done=item.done=true;state().matches++;add(15);drawGame();$('gameMsg').textContent=gameItems.every(x=>x.done)?'🏆 เยี่ยมมาก! จับคู่ครบแล้ว':'🎉 ถูกต้อง! +15 คะแนน'}else{gamePick=null;$('gameMsg').textContent='ลองอีกครั้งนะ!';drawGame();$('gameMsg').textContent='ลองอีกครั้งนะ!'}};area.appendChild(b)})}
function renderProgress(){let s=state(),pct=Math.round(s.learned.length/current().length*100);$('progress').innerHTML=`<div class="card"><h2>🏆 ความก้าวหน้า ป.${grade}</h2><p class="big">⭐ ${s.points} คะแนน</p><p class="thai">เรียนแล้ว ${s.learned.length} / ${current().length} คำ</p><div class="progress"><div style="width:${pct}%"></div></div><div class="grid" style="margin-top:20px"><div class="card"><h2>🧠 ${s.quiz}</h2>ข้อที่ทำแล้ว</div><div class="card"><h2>🎯 ${s.quiz?Math.round(s.correct/s.quiz*100):0}%</h2>ตอบถูก</div><div class="card"><h2>🎮 ${s.matches}</h2>คู่ที่จับสำเร็จ</div></div><p class="muted">ข้อมูลเก็บไว้ในเบราว์เซอร์ของเครื่องนี้ หากล้างข้อมูลเว็บไซต์ คะแนนอาจหายไป</p><button id="reset">ล้างคะแนน ป.${grade}</button></div>`;$('reset').onclick=()=>{if(confirm('ต้องการล้างความก้าวหน้าของ ป.'+grade+' หรือไม่?')){delete stats[grade];record();renderProgress()}}}
function renderAll(){renderLearn();renderQuiz();renderGame();renderProgress()}$('grade').value=grade;$('grade').onchange=e=>{grade=e.target.value;localStorage.setItem('se_grade',grade);index=0;qIndex=0;record();renderAll()};record();renderAll();
</script></body></html>
